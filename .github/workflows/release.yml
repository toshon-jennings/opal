name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: perci-mac
          path: dist_electron/
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: perci-win
          path: dist_electron/
          if-no-files-found: error

  attach-to-release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Ensure release exists
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to release
        run: |
          # electron-updater discovers releases by fetching latest-mac.yml /
          # latest.yml from the release, and uses the .blockmap files for
          # differential downloads. Uploading only the installers leaves those
          # manifests 404ing, which silently disables auto-update entirely --
          # every release from v0.43.0 to v0.45.8 shipped that way.
          # `if` rather than `[ -f ... ] &&` so a glob that matches nothing is
          # unambiguously a skip, not a loop body whose exit status depends on
          # the shell's `set -e` treatment of `&&` lists.
          for f in artifacts/perci-mac/*.dmg artifacts/perci-mac/*.dmg.blockmap \
                   artifacts/perci-mac/latest-mac.yml \
                   artifacts/perci-win/*.exe artifacts/perci-win/*.exe.blockmap \
                   artifacts/perci-win/latest.yml; do
            if [ -f "$f" ]; then
              gh release upload "${{ github.ref_name }}" "$f" --repo "${{ github.repository }}" --clobber
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
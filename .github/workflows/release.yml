name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            artifact: perci-mac-arm64
          - arch: x64
            runner: macos-15-intel
            artifact: perci-mac-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist_electron/*.dmg
            dist_electron/*.dmg.blockmap
            dist_electron/*.zip
            dist_electron/*.zip.blockmap
            dist_electron/latest-mac.yml
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: perci-win
          path: dist_electron/
          if-no-files-found: error

  attach-to-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      # Needed for .github/release-install-notes.md in the last step.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --omit=optional
      - name: Merge macOS update manifests
        run: >-
          node scripts/merge-mac-update-manifests.mjs
          artifacts/perci-mac-arm64/latest-mac.yml
          artifacts/perci-mac-x64/latest-mac.yml
          artifacts/latest-mac.yml
      - name: Ensure release exists
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to release
        run: |
          # electron-updater discovers releases by fetching latest-mac.yml /
          # latest.yml from the release, and uses the .blockmap files for
          # differential downloads. Uploading only the installers leaves those
          # manifests 404ing, which silently disables auto-update entirely --
          # every release from v0.43.0 to v0.45.8 shipped that way.
          # `if` rather than `[ -f ... ] &&` so a glob that matches nothing is
          # unambiguously a skip, not a loop body whose exit status depends on
          # the shell's `set -e` treatment of `&&` lists.
          #
          # The mac .zip is what actually updates the app: electron-updater's
          # MacUpdater looks for a zip and explicitly refuses dmg/pkg, so a
          # dmg-only release parses fine and then dies with
          # ERR_UPDATER_ZIP_FILE_NOT_FOUND on download. The dmg stays for
          # first-time installs and manual downloads.
          for f in artifacts/perci-mac-*/*.dmg artifacts/perci-mac-*/*.dmg.blockmap \
                   artifacts/perci-mac-*/*.zip artifacts/perci-mac-*/*.zip.blockmap \
                   artifacts/latest-mac.yml \
                   artifacts/perci-win/*.exe artifacts/perci-win/*.exe.blockmap \
                   artifacts/perci-win/latest.yml; do
            if [ -f "$f" ]; then
              gh release upload "${{ github.ref_name }}" "$f" --repo "${{ github.repository }}" --clobber
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepend install instructions to release notes
        # A release lists six assets, only two of which a human should download,
        # and macOS refuses to open the app until the user clicks through
        # Privacy & Security. Neither is guessable from the file list, so both
        # go at the top of every release body. Drop this step once the app is
        # signed with a Developer ID.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          body=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)
          # Idempotent: re-running the workflow on an existing tag must not
          # stack duplicate copies of the install section.
          case "$body" in
            *'## Install'*) echo "Install section already present; leaving notes alone."; exit 0 ;;
          esac
          sed "s/__VERSION__/${TAG#v}/g" .github/release-install-notes.md > notes.md
          printf '\n---\n\n%s\n' "$body" >> notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
